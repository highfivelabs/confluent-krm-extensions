  - serviceaccounts/finalizers
  - switchoverendpoints/finalizers
  - switchoverpairs/finalizers
  - tableflowtopics/finalizers
  - transitgatewayattachments/finalizers
  verbs:
  - update
- apiGroups:
  - core.confluent.hfl.dev
  resources:
  - connections
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - ''
  resources:
  - secrets
  verbs:
  - get
  - list
  - watch
  - create
  - update
- apiGroups:
  - coordination.k8s.io
  resources:
  - leases
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - patch
  - delete
- apiGroups:
  - ''
  resources:
  - events
  verbs:
  - create
  - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: confluent-krm-extensions-manager
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: confluent-krm-extensions-manager
subjects:
- kind: ServiceAccount
  name: manager
  namespace: confluent-krm-extensions-system
