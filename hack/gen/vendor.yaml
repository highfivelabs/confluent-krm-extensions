# Inputs to krm-rest-runtime/gen/krmgen.py. Specs are pinned to the commit in each url;
# hack/gen/fetch-specs.sh downloads them. overrides: map (Terraform type -> API item path),
# exclude (Terraform types), excludePaths (API item paths).
vendor: confluent
title: Confluent Cloud
groupSuffix: confluent.hfl.dev
connectionKind: Connection
credentialKeys:
- apiKey
- apiSecret
baseURLHelp: Confluent Cloud API base URL; default https://api.confluent.cloud.
terraform:
  provider: confluentinc/confluent
  prefix: confluent
  gaps: terraform-gaps.json
specs:
- file: specs/confluent.yaml
  url: https://docs.confluent.io/cloud/current/openapi.yaml
  sha256: 4d2a5f295d93781c8bc125c319c3b9f4aa22052390021b710291545e5c01c956
# Required query parameters filled from the spec: Confluent Cloud reads,
# updates and deletes most resources only with ?environment=<the spec's
# environment.id> (and Tableflow's with ?spec.kafka_cluster=...).
queryFromSpec:
- environment
- kafka_cluster
- cloud
- region
# x-immutable fields are createOnly (sent on create, never in an update): Confluent
# Cloud refuses a PATCH that names one, even with its current value.
immutableFromSpec: true
envelope:
  response:
  - spec
  request:
  - spec
# Kinds written by hand (hack/gen/kinds/*.yaml, sources in each).
handwritten: {dir: kinds}
# Terraform types that will not be kinds (README "Not covered", generated).
hardBlocks:
  confluent_tf_importer: >-
    Not an API resource: it reads existing resources and writes Terraform
    configuration and state for them, on the machine running Terraform.
overrides:
  # Confluent never reads a webhook integration's URL back (the live run of
  # 2026-11-20 read target = {kind: Webhook} after sending the url), so it
  # is not compared for drift; it is sent when the spec changes (HFL-675).
  writeOnly:
    /notifications/v1/integrations/{id}: [target.url]
    # A Flink connection's credentials, a JSON string of the connection
    # type's secret keys (API_KEY, AWS_SECRET_ACCESS_KEY, ...), are never read
    # back: set spec.auth_data.data from a Secret (secretRefs:
    # {"spec.auth_data.data": {name, key}}).
    /sql/v1/organizations/{organization_id}/environments/{environment_id}/connections/{connection_name}: [spec.auth_data]
  # Data-plane APIs on other hosts. Kinds for these paths reach their own
  # endpoint through a second Connection (spec.connectionRef), whose baseURL
  # is that host and whose Secret holds that endpoint's API key (README,
  # "Data-plane kinds"). Kept out: what Confluent for Kubernetes covers
  # (schemas, schema exporters), what only reads (contexts, cluster config,
  # compatibility checks), and the rest of Flink SQL (/sql/v1, statements
  # and connections aside).
  excludePathPrefixes:
  - /exporters
  - /subjects
  - /schemas
  - /compatibility
  - /contexts
  - /clusterconfig
  - /sql/v1/organizations/{organization_id}/environments/{environment_id}/databases/{kafka_cluster_id}/agents
  - /sql/v1/organizations/{organization_id}/environments/{environment_id}/databases/{database_name}/tools
  - /sql/v1/organizations/{organization_id}/environments/{environment_id}/agents
  - /query/v1
  map:
    confluent_kafka_mirror_topic: /kafka/v3/clusters/{cluster_id}/links/{link_name}/mirrors/{mirror_topic_name}
    # A Flink SQL statement, on the region's Flink endpoint (README).
    confluent_flink_statement: /sql/v1/organizations/{organization_id}/environments/{environment_id}/statements/{statement_name}
    # A Flink connection (a model provider's endpoint and credentials), on the
    # region's Flink endpoint too.
    confluent_flink_connection: /sql/v1/organizations/{organization_id}/environments/{environment_id}/connections/{connection_name}
    confluent_flink_materialized_table: /sql/v1/organizations/{organization_id}/environments/{environment_id}/databases/{kafka_cluster_id}/materialized-tables/{table_name}
    confluent_kafka_cluster: /cmk/v2/clusters/{id}
    confluent_api_key: /iam/v2/api-keys/{id}
    confluent_flink_compute_pool: /fcpm/v2/compute-pools/{id}
    confluent_flink_compute_pool_config: /fcpm/v2/compute-pool-config
    confluent_ksql_cluster: /ksqldbcm/v2/clusters/{id}
    confluent_provider_integration: /pim/v1/integrations/{id}
    confluent_custom_connector_plugin_version: /ccpm/v1/plugins/{plugin_id}/versions/{id}
    # Provider integrations v2: Terraform splits one integration into its
    # setup (POST, with the provider and display name) and its authorization
    # (PATCH of config, the customer's cloud details, once the cloud side is
    # ready). Both act on /pim/v2/integrations/{id}: one kind, whose update
    # sends the authorization.
    confluent_provider_integration_setup: /pim/v2/integrations/{id}
    confluent_provider_integration_authorization: /pim/v2/integrations/{id}
    # Schema Registry (its endpoint, a Schema Registry API key).
    confluent_schema_registry_cluster_config: /config
    confluent_schema_registry_cluster_mode: /mode
    confluent_subject_config: /config/{subject}
    confluent_subject_mode: /mode/{subject}
    confluent_schema_registry_kek: /dek-registry/v1/keks/{name}
    confluent_schema_registry_dek: /dek-registry/v1/keks/{name}/deks/{subject}
    # Stream Catalog (the Schema Registry endpoint and key).
    confluent_tag: /catalog/v1/types/tagdefs/{tagName}
    confluent_business_metadata: /catalog/v1/types/businessmetadatadefs/{bmName}
    # Kafka REST (the cluster's REST endpoint, a Kafka API key for the
    # cluster): one broker setting per object, which Terraform sets as a map
    # through broker-configs:alter.
    confluent_kafka_cluster_config: /kafka/v3/clusters/{cluster_id}/broker-configs/{name}
    # Kafka REST: one ACL, a link (assocs below).
    confluent_kafka_acl: /kafka/v3/clusters/{cluster_id}/acls
    # Stream Catalog: a tag or a business metadata on one entity, made by
    # POSTing a list of them, read in the entity's list, deleted by name.
    confluent_tag_binding: /catalog/v1/entity/type/{typeName}/name/{qualifiedName}/tags/{tagName}
    confluent_business_metadata_binding: /catalog/v1/entity/type/{typeName}/name/{qualifiedName}/businessmetadata/{bmName}
  kindNames:
    /pim/v2/integrations/{id}: ProviderIntegrationV2
  excludePaths:
  # Unified Stream Manager registers clusters outside Confluent Cloud; it
  # only shares words with confluent_kafka_cluster_config.
  - /usm/v1/kafka-clusters/{id}
  # Disaster-recovery switchover: every call but the create needs
  # ?environment=<env id>, which the body carries only inside a CRN
  # (parent_resource_crn, environment_crn): the spec names it again.
  queryFields:
    /switchover/v1/switchover-endpoints/{id}: [environment]
    /switchover/v1/switchover-pairs/{id}: [environment]
  # A Kafka ACL is a link: made by POST .../acls, found in the cluster's
  # list ({"data": [...]}), and deleted by DELETE .../acls naming its
  # fields in the query (which deletes every ACL that matches them all).
  assocs:
  - create: /kafka/v3/clusters/{cluster_id}/acls
    read: /kafka/v3/clusters/{cluster_id}/acls
    delete: /kafka/v3/clusters/{cluster_id}/acls
    deleteMethod: delete
    list: data
    deleteQuery:
      resource_type: '{resource_type}'
      resource_name: '{resource_name}'
      pattern_type: '{pattern_type}'
      principal: '{principal}'
      host: '{host}'
      operation: '{operation}'
      permission: '{permission}'
  # A binding's path names the entity and the tag by the create body's own
  # fields, under other names: {typeName} is entityType, {qualifiedName}
  # entityName (and the ID, {tagName} or {bmName}, the body's typeName).
  creates:
    /kafka/v3/clusters/{cluster_id}/links/{link_name}/mirrors/{mirror_topic_name}: /kafka/v3/clusters/{cluster_id}/links/{link_name}/mirrors
    /catalog/v1/entity/type/{typeName}/name/{qualifiedName}/tags/{tagName}: /catalog/v1/entity/tags
    /catalog/v1/entity/type/{typeName}/name/{qualifiedName}/businessmetadata/{bmName}: /catalog/v1/entity/businessmetadata
  paramFields:
    /catalog/v1/entity/type/{typeName}/name/{qualifiedName}/tags/{tagName}: {typeName: entityType, qualifiedName: entityName}
    /catalog/v1/entity/type/{typeName}/name/{qualifiedName}/businessmetadata/{bmName}: {typeName: entityType, qualifiedName: entityName}
  readFrom:
    /catalog/v1/entity/type/{typeName}/name/{qualifiedName}/tags/{tagName}: {path: "/catalog/v1/entity/type/{typeName}/name/{qualifiedName}/tags", field: typeName, param: tagName}
    /catalog/v1/entity/type/{typeName}/name/{qualifiedName}/businessmetadata/{bmName}: {path: "/catalog/v1/entity/type/{typeName}/name/{qualifiedName}/businessmetadata", field: typeName, param: bmName}
  # A business metadata binding's attributes change by a PUT of the list.
  updates:
    /catalog/v1/entity/type/{typeName}/name/{qualifiedName}/businessmetadata/{bmName}: {path: /catalog/v1/entity/businessmetadata, method: put}
  updateID:
    /catalog/v1/entity/type/{typeName}/name/{qualifiedName}/businessmetadata/{bmName}: typeName
  # The spec gives the client-quota create body as an example only, without a
  # schema; the body is the same {spec: ClientQuotaSpec} the update takes.
  extraFields:
    /kafka-quotas/v1/client-quotas/{id}:
      spec:
        $ref: '#/components/schemas/kafka-quotas.v1.ClientQuotaSpec'
        required: true
    # Required: reads and deletes name it (readQuery, deleteQuery below).
    /dek-registry/v1/keks/{name}/deks/{subject}:
      algorithm:
        type: string
        enum: [AES128_GCM, AES256_GCM, AES256_SIV]
        required: true
  # Tag and business-metadata definitions are created by POSTing a list of
  # them and are named by name; one object is one definition.
  bodyArray:
  - /catalog/v1/types/tagdefs/{tagName}
  - /catalog/v1/types/businessmetadatadefs/{bmName}
  - /catalog/v1/entity/type/{typeName}/name/{qualifiedName}/tags/{tagName}
  - /catalog/v1/entity/type/{typeName}/name/{qualifiedName}/businessmetadata/{bmName}
  idFrom:
    /catalog/v1/entity/type/{typeName}/name/{qualifiedName}/tags/{tagName}: typeName
    /catalog/v1/entity/type/{typeName}/name/{qualifiedName}/businessmetadata/{bmName}: typeName
    /sql/v1/organizations/{organization_id}/environments/{environment_id}/statements/{statement_name}: name
    /sql/v1/organizations/{organization_id}/environments/{environment_id}/connections/{connection_name}: name
    /sql/v1/organizations/{organization_id}/environments/{environment_id}/databases/{kafka_cluster_id}/materialized-tables/{table_name}: name
    /catalog/v1/types/tagdefs/{tagName}: name
    /catalog/v1/types/businessmetadatadefs/{bmName}: name
  # A KEK's update (PUT) takes only kmsProps, doc and shared.
  createOnly:
    # A materialized table is named once; its PUT names it as the read does.
    /sql/v1/organizations/{organization_id}/environments/{environment_id}/databases/{kafka_cluster_id}/materialized-tables/{table_name}: [name]
    # A binding's business metadata is named once; the update names it so.
    /catalog/v1/entity/type/{typeName}/name/{qualifiedName}/businessmetadata/{bmName}: [typeName]
    /dek-registry/v1/keks/{name}: [name, kmsType, kmsKeyId, deleted]
  # A DEK is one per KEK, subject and algorithm; reads and deletes name the
  # algorithm (default AES256_GCM), as the Terraform provider's do, so the
  # spec must too.
  readQuery:
    /dek-registry/v1/keks/{name}/deks/{subject}:
      algorithm: '{algorithm}'
  deleteQuery:
    /dek-registry/v1/keks/{name}/deks/{subject}:
      algorithm: '{algorithm}'
  envelope:
    /sql/v1/organizations/{organization_id}/environments/{environment_id}/statements/{statement_name}: {response: "", request: ""}
    # A connection too (resource_flink_connection.go: PUT of {name, spec},
    # only the credentials changed).
    /sql/v1/organizations/{organization_id}/environments/{environment_id}/connections/{connection_name}: {response: "", request: ""}
    # A materialized table is too (resource_flink_materialized_table.go:
    # GET, change the spec, PUT the table with what the read answered).
    /sql/v1/organizations/{organization_id}/environments/{environment_id}/databases/{kafka_cluster_id}/materialized-tables/{table_name}: {response: "", request: ""}
  carry:
    /sql/v1/organizations/{organization_id}/environments/{environment_id}/statements/{statement_name}: [name, metadata.resource_version]
    /sql/v1/organizations/{organization_id}/environments/{environment_id}/connections/{connection_name}: [name]
    /sql/v1/organizations/{organization_id}/environments/{environment_id}/databases/{kafka_cluster_id}/materialized-tables/{table_name}: [name, metadata.resource_version]
  omitUnchanged:
    /cmk/v2/clusters/{id}:
    - config
    - display_name
  # A statement's PATCH takes a JSON Patch; Terraform's update is the PUT.
  excludeOperationIdPrefixes:
  - patchSqlv1Statement
  deletes:
    /kafka/v3/clusters/{cluster_id}/links/{link_name}/mirrors/{mirror_topic_name}: "/kafka/v3/clusters/{cluster_id}/topics/{current.mirror_topic_name}"
